<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Library</title>
  </head>
  <body>
    <header>
      <h1>Library app</h1>
      <div class="add-new-book">
        <button
          class="add-book-btn"
          id="add-book-btn"
          command="show-modal"
          commandfor="my-dialog"
        >
          Add book
        </button>
      </div>
    </header>
    <main class="book-content" id="book-content"></main>

    <dialog id="my-dialog" class="dialog">
      <form action="" class="new-book-form">
        <div class="form-group">
          <label for="book-title">Book Title</label>
          <input type="text" id="book-title" name="book-title" required />
        </div>

        <div class="form-group">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" name="book-author" required />
        </div>

        <div class="form-group">
          <label for="book-pages">Pages</label>
          <input
            type="number"
            id="book-pages"
            name="book-pages"
            required
            min="1"
          />
        </div>

        <div class="form-group">
          <label for="is-read">Read</label>
          <input type="checkbox" name="is-read" id="is-read" />
        </div>
        <div class="form-group">
          <button type="submit" id="submit-btn" class="submit-btn">
            Add Book
          </button>
        </div>
      </form>
      <button commandfor="my-dialog" command="close" class="close-btn">
        <img src="./images/close-icon.svg" alt="" class="close-icon" />
      </button>
    </dialog>
    <script src="./index.js"></script>
  </body>
</html>
